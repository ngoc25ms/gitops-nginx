apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-html
  namespace: nginx-demo
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>GitOps with ArgoCD</title>
      <style>
        body { font-family: Arial, sans-serif; background: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 40px 60px; text-align: center; }
        h1 { color: #58a6ff; font-size: 2.5rem; margin-bottom: 10px; }
        p { color: #8b949e; font-size: 1.1rem; }
        .badge { display: inline-block; background: #1f6feb; color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; margin-top: 16px; }
      </style>
    </head>
    <body>
      <div class="card">
        <h1>Hello from ArgoCD!</h1>
        <p>App nay duoc deploy tu Git boi ArgoCD</p>
        <div class="badge">version: v1.0.0</div>
      </div>
    </body>
    </html>
