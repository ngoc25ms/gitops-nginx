apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nginx-dev

resources:
  - ../../base

namePrefix: dev-

patches:
  - path: replicas-patch.yaml
    target:
      kind: Deployment
      name: nginx-demo

images:
  - name: nginx
    newTag: "1.27"

labels:
  - includeSelectors: true
    pairs:
      env: dev
